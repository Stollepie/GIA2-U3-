<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fashion Vocabulary — Learning Mode</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202532;background:#f5f6fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px 14px 50px}.wrap{max-width:710px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#717b91;font-weight:750}h1{font-size:clamp(26px,5vw,37px);letter-spacing:-.05em;margin:7px 0}p{color:#647086;line-height:1.5}.panel{background:#fff;border:1px solid #e7e9f0;border-radius:25px;box-shadow:0 12px 35px #1b31540b;padding:clamp(18px,5vw,32px);margin-top:20px}.pill{border-radius:999px;background:#eaeaf8;padding:9px 13px;color:#5253a4;font-size:13px;font-weight:750}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#647086;font-weight:650}.track{height:9px;border-radius:20px;background:#e9eaf2;margin:14px 0 28px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#8c80e7,#5e78dc);transition:width .3s}.question-label{color:#7b8397;font-size:13px;font-weight:700}h2{font-size:clamp(25px,5vw,34px);letter-spacing:-.04em;margin:10px 0 25px;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{appearance:none;text-align:left;border:2px solid #e7eaf0;border-radius:17px;background:#fafbfe;color:#283248;padding:18px;font:600 16px/1.4 inherit;min-height:88px;cursor:pointer;transition:background .15s,border .15s,transform .15s}.answer:active{transform:scale(.99)}.answer:focus-visible,.primary:focus-visible{outline:3px solid #7974db;outline-offset:3px}.answer.correct{background:#a9f4bf;border-color:#0a9b43;color:#07582b;font-weight:800;animation:buzz .42s ease-in-out}.answer.wrong{background:#ffb2b2;border-color:#d91e2c;color:#84111c;font-weight:800}.answer:disabled{cursor:default;opacity:1}@keyframes buzz{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-4px)}30%,60%,90%{transform:translateX(4px)}}.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:650;line-height:1.5;background:#eff8f0;color:#18572c}.feedback.bad{background:#fff0f0;color:#8a1d26}.bottom{display:flex;justify-content:flex-end;margin-top:20px}.primary{background:#292d40;color:white;border:0;border-radius:14px;padding:15px 22px;font:700 15px inherit;cursor:pointer;min-height:50px}.primary:disabled{opacity:.4;cursor:default}.secondary{border:1px solid #d7dce7;border-radius:12px;background:#fff;color:#4e5770;padding:11px 15px;font-weight:700;cursor:pointer}.hidden{display:none}.summary{text-align:center}.summary h2{margin:6px 0}.review{text-align:left;margin-top:18px}.review li{padding:7px 0;color:#384258}.note{font-size:13px;margin:0 0 8px}@media(max-width:540px){body{padding:18px 12px 36px}.panel{border-radius:20px;padding:20px 15px}.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:65px;padding:15px 16px;font-size:16px}.bottom .primary{width:100%}.top .secondary{padding:9px 12px}h2{margin-bottom:20px}}@media(prefers-reduced-motion:reduce){.answer.correct{animation:none}*{scroll-behavior:auto!important}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Vocabulary practice · Learning mode</div><h1>Fashion & Clothes</h1></div><button class="secondary" id="restart" type="button">Restart</button></div><p class="note">Choose the matching definition. Get each word right twice in a row to master it.</p><section class="panel" id="game"><div class="stats"><span id="mastered">0 / 10 mastered</span><span id="attempts">0 attempts</span></div><div class="track" role="progressbar" aria-label="Mastery progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><div class="question-label" id="questionLabel">Choose the correct definition</div><h2 id="term"></h2><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="bottom"><button class="primary" id="next" disabled type="button">Continue →</button></div></section><section class="panel summary hidden" id="summary"><div class="eyebrow">Session complete</div><h2>All words mastered!</h2><p id="results"></p><div class="review" id="review"></div><button class="primary" id="again">Practise again</button></section></main><script>
const words=[['striped','something with stripes'],['checked','with a pattern of squares'],['plain','something that has one colour'],['spotted','covered in small, usually round areas of colour'],['baggy','not tight'],['tight','fit your body very closely'],['smart','stylish'],['casual','for everyday'],['enormous','very big'],['leather','a material made from the skin of an animal']];
const $=id=>document.getElementById(id);let streak,misses,attempts,queue,current,locked,previous;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function init(){streak=Array(words.length).fill(0);misses=Array(words.length).fill(0);attempts=0;queue=shuffle(words.map((_,i)=>i));current=null;previous=-1;locked=false;$('game').classList.remove('hidden');$('summary').classList.add('hidden');show()}
function update(){const count=streak.filter(x=>x>=2).length;$('mastered').textContent=`${count} / ${words.length} mastered`;$('attempts').textContent=`${attempts} attempt${attempts===1?'':'s'}`;$('fill').style.width=`${100*count/words.length}%`;$('progress').setAttribute('aria-valuenow',count)}
function show(){update();if(streak.every(s=>s>=2)){finish();return}if(!queue.length)queue=shuffle(words.map((_,i)=>i).filter(i=>streak[i]<2));let pos=queue.findIndex(i=>i!==previous);if(pos<0)pos=0;current=queue.splice(pos,1)[0];previous=current;locked=false;$('next').disabled=true;$('feedback').className='feedback hidden';$('term').textContent=words[current][0];$('answers').replaceChildren();const correct=words[current][1];const others=shuffle(words.map((w,i)=>({definition:w[1],i})).filter(x=>x.i!==current)).slice(0,3).map(x=>x.definition);shuffle([correct,...others]).forEach(def=>{const btn=document.createElement('button');btn.type='button';btn.className='answer';btn.textContent=def;btn.addEventListener('click',()=>answer(def));$('answers').append(btn)})}
function answer(selected){if(locked)return;locked=true;attempts++;const correct=words[current][1],ok=selected===correct;if(ok){streak[current]++}else{streak[current]=0;misses[current]++}for(const btn of $('answers').children){btn.disabled=true;if(btn.textContent===correct)btn.classList.add('correct');else if(btn.textContent===selected)btn.classList.add('wrong')}$('feedback').className='feedback'+(ok?'':' bad');$('feedback').textContent=ok?(streak[current]>=2?'Excellent! You’ve mastered this word.':'Correct! One more correct answer to master this word.'):`Not quite. Correct answer: ${correct}`;if(streak[current]<2){const gap=Math.min(3,queue.length);queue.splice(gap,0,current)}$('next').disabled=false;update()}
function finish(){$('game').classList.add('hidden');$('summary').classList.remove('hidden');$('results').textContent=`You mastered all ${words.length} words in ${attempts} attempts.`;const difficult=words.map((w,i)=>({word:w[0],count:misses[i]})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);$('review').replaceChildren();if(difficult.length){const h=document.createElement('strong');h.textContent='Words to revisit';$('review').append(h);const ul=document.createElement('ul');difficult.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.word} — ${x.count} mistake${x.count===1?'':'s'}`;ul.append(li)});$('review').append(ul)}}
$('next').addEventListener('click',show);$('again').addEventListener('click',init);$('restart').addEventListener('click',()=>{if(confirm('Restart learning? Your current progress will be cleared.'))init()});init();
</script></body></html>
